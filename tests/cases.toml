# Expectations for `bot-harness` from the Cygnixy workspace:
#
#   bot-harness <this repository>
#
# Each case loads a fixture (an interface snapshot as get_interface returns
# it), runs one action against stubbed cygnixy.*, and checks the outcome and
# what the bot did along the way. The fixtures are synthetic and minimal: they
# carry exactly the fields the actions read, nothing personal, nothing extra.

# --- conditions ------------------------------------------------------------

[[case]]
name = "docked: the station window is recognised"
fixture = "tests/fixtures/docked_with_route.json"
action = "in_station"
expect = "Success"

[[case]]
name = "in space: no station window means not docked"
fixture = "tests/fixtures/in_space_warping.json"
action = "in_station"
expect = "Failure"

[[case]]
name = "a set route is recognised by its markers"
fixture = "tests/fixtures/docked_with_route.json"
action = "is_route_set"
expect = "Success"

[[case]]
name = "warping is recognised"
fixture = "tests/fixtures/in_space_warping.json"
action = "is_warp"
expect = "Success"

[[case]]
name = "warping is not a jump"
fixture = "tests/fixtures/in_space_warping.json"
action = "is_jump"
expect = "Failure"

[[case]]
name = "approaching counts as movement"
fixture = "tests/fixtures/approaching_station.json"
action = "is_approach"
expect = "Success"

[[case]]
name = "a session change is recognised"
fixture = "tests/fixtures/session_changing.json"
action = "is_session_change"
expect = "Success"

[[case]]
name = "no session change while docked"
fixture = "tests/fixtures/docked_with_route.json"
action = "is_session_change"
expect = "Failure"

[[case]]
name = "an empty message-box list is not a message box"
fixture = "tests/fixtures/docked_with_route.json"
action = "is_message_boxes"
expect = "Failure"

[[case]]
name = "an absent timer counts as elapsed"
fixture = "tests/fixtures/docked_with_route.json"
action = "is_timer_elapsed"
args = ["warp_timestamp", 3]
expect = "Success"

# --- actions ---------------------------------------------------------------

[[case]]
name = "docked with a route: the undock button is pressed by path"
fixture = "tests/fixtures/docked_with_route.json"
action = "push_undock_button"
expect = "Success"
log_contains = [
    "click_path(\"station_window.buttons.Undock\"",
    "bb_set _state = String(\"undock\")",
]

[[case]]
name = "the route marker menu offers the gate and it is chosen"
fixture = "tests/fixtures/route_menu_open.json"
action = "open_route_menu_and_warp"
expect = "Success"
log_contains = [
    "open_menu right_click \"info_panel_container.info_panel_route.route_element_marker[0].region\"",
    "open_menu chose \"Jump Through Stargate\"",
    "info: flight: ordered Jump Through Stargate from the menu",
    "bb_set _state = String(\"warp\")",
]

[[case]]
name = "no menu opens: the action keeps running and says so"
fixture = "tests/fixtures/docked_with_route.json"
action = "open_route_menu_and_warp"
expect = "Running"
log_contains = ["no context menu opened"]

[[case]]
name = "bookmark rows sharing one region are refused, not guessed at"
fixture = "tests/fixtures/bookmark_rows_share_region.json"
action = "open_dock_bookmarks_menu_and_warp"
expect = "Failure"
log_contains = ["not addressable"]

[[case]]
name = "stealth presses F1 and records the time"
fixture = "tests/fixtures/in_space_warping.json"
action = "stealth"
expect = "Success"
log_contains = ["press_key(112.0,)", "bb_set stealth_timestamp"]

# --- set_route: the search --------------------------------------------------

[[case]]
name = "no destination given: there is nothing to set"
fixture = "tests/fixtures/search_closed.json"
action = "set_route_has_destination"
args = [""]
expect = "Failure"

[[case]]
name = "a destination given: the command has work"
fixture = "tests/fixtures/search_closed.json"
action = "set_route_has_destination"
args = ["Jita"]
expect = "Success"

[[case]]
name = "the closed search panel is opened by its magnifier"
fixture = "tests/fixtures/search_closed.json"
action = "set_route_open_search"
expect = "Running"
log_contains = ["click_path(\"info_panel_container.icons.search\""]

[[case]]
name = "the open panel is left alone: the magnifier is a toggle"
fixture = "tests/fixtures/search_open_empty.json"
action = "set_route_open_search"
expect = "Success"

[[case]]
name = "an empty field needs no clearing"
fixture = "tests/fixtures/search_open_empty.json"
action = "set_route_clear_field"
expect = "Success"

[[case]]
name = "a field holding an old query is cleared first"
fixture = "tests/fixtures/search_open_stale_text.json"
action = "set_route_clear_field"
expect = "Running"
log_contains = ["click(341, 85"]

[[case]]
name = "the destination is typed into the focused field"
fixture = "tests/fixtures/search_open_empty.json"
action = "set_route_type_destination"
args = ["Jita"]
expect = "Running"
log_contains = [
    "click(226, 85",
    "type_text(\"Jita\")",
    "info: route: searching for \"Jita\"",
]

[[case]]
name = "what is already typed is not typed again"
fixture = "tests/fixtures/search_groups_collapsed.json"
action = "set_route_type_destination"
args = ["Jita"]
expect = "Success"

# --- set_route: the results -------------------------------------------------

[[case]]
name = "collapsed groups need no collapsing"
fixture = "tests/fixtures/search_groups_collapsed.json"
action = "set_route_collapse_groups"
expect = "Success"

[[case]]
name = "an expanded category is collapsed to reach the short list"
fixture = "tests/fixtures/search_category_expanded.json"
action = "set_route_collapse_groups"
expect = "Running"
log_contains = ["click(820, 403"]

[[case]]
name = "the system category is expanded by name, not by position"
fixture = "tests/fixtures/search_groups_collapsed.json"
action = "set_route_expand_category"
args = ["system"]
expect = "Running"
log_contains = ["click(952, 480"]

[[case]]
name = "the station category is expanded for a station destination"
fixture = "tests/fixtures/search_groups_collapsed.json"
action = "set_route_expand_category"
args = ["station"]
expect = "Running"
log_contains = ["click(952, 504"]

[[case]]
name = "an unknown kind is refused, not guessed at"
fixture = "tests/fixtures/search_groups_collapsed.json"
action = "set_route_expand_category"
args = ["planet"]
expect = "Failure"
log_contains = ["error: route: unknown destination kind"]

[[case]]
name = "the row named exactly right is right-clicked and Set Destination chosen"
fixture = "tests/fixtures/search_row_menu_open.json"
action = "set_route_choose"
args = ["Jita"]
expect = "Success"
log_contains = [
    "open_menu right_click region",
    "open_menu chose \"Set Destination\"",
    "info: route: destination set to \"Jita\"",
]

[[case]]
name = "no menu opens on the row: keep trying, do not fail the mission"
fixture = "tests/fixtures/search_category_expanded.json"
action = "set_route_choose"
args = ["Jita"]
expect = "Running"
log_contains = ["no context menu opened"]

[[case]]
name = "a real station row is matched through its markup and jump count"
fixture = "tests/fixtures/search_station_row_live.json"
action = "set_route_choose"
args = ["Jita IV - Moon 4 - Caldari Navy Assembly Plant"]
expect = "Running"
log_contains = ["open_menu right_click region", "no context menu opened"]

[[case]]
name = "four hundred characters named Jita are not the system Jita"
fixture = "tests/fixtures/search_no_exact_match.json"
action = "set_route_choose"
args = ["Jita"]
expect = "Failure"
log_contains = ["error: route: no row is named exactly Jita"]

[[case]]
name = "a route already set is a command already done"
fixture = "tests/fixtures/route_already_set.json"
action = "is_route_set"
expect = "Success"

# --- set_route: the route block ---------------------------------------------

[[case]]
name = "a collapsed route block is opened by its icon"
fixture = "tests/fixtures/route_block_hidden.json"
action = "set_route_show_route"
expect = "Running"
log_contains = ["click_path(\"info_panel_container.icons.route\""]

[[case]]
name = "a shown route block is left alone: the icon is a toggle"
fixture = "tests/fixtures/route_already_set.json"
action = "set_route_show_route"
expect = "Success"

[[case]]
name = "the route has appeared: the command is done"
fixture = "tests/fixtures/route_already_set.json"
action = "set_route_confirm"
expect = "Success"

[[case]]
name = "no route yet: wait for the client, do not fail the mission"
fixture = "tests/fixtures/search_closed.json"
action = "set_route_confirm"
expect = "Running"

# --- set_route: putting the search away --------------------------------------

[[case]]
name = "the results window is closed once the route is set"
fixture = "tests/fixtures/search_groups_collapsed.json"
action = "set_route_close_search"
expect = "Running"
log_contains = ["click(960, 706"]

[[case]]
name = "with the window gone the panel is toggled shut"
fixture = "tests/fixtures/search_open_empty.json"
action = "set_route_close_search"
expect = "Running"
log_contains = ["click_path(\"info_panel_container.icons.search\""]

[[case]]
name = "nothing left open is nothing to close"
fixture = "tests/fixtures/search_closed.json"
action = "set_route_close_search"
expect = "Success"

# --- the log: what the mission says about itself ------------------------------

[[case]]
name = "the mission says where it is bound and what the route shows"
fixture = "tests/fixtures/journal_docked_jita.json"
action = "journal"
args = ["Jita IV - Moon 4 - Caldari Navy Assembly Plant", "station"]
expect = "Success"
log_contains = [
    "info: mission: bound for Jita IV - Moon 4 - Caldari Navy Assembly Plant, looked up among the stations",
    "info: route: the client is showing the route; next waypoint Perimeter",
]

[[case]]
name = "with no destination the mission says it is flying the route it was given"
fixture = "tests/fixtures/journal_docked_jita.json"
action = "journal"
expect = "Success"
log_contains = ["info: mission: no destination given"]

[[case]]
name = "leaving the station is recorded, whoever pressed the button"
fixtures = [
    "tests/fixtures/journal_docked_jita.json",
    "tests/fixtures/journal_space_jita.json",
]
action = "journal"
expect = "Success"
log_contains = ["info: flight: undocked into Jita"]

[[case]]
name = "a jump is counted when the system under the ship changes"
fixtures = [
    "tests/fixtures/journal_space_jita.json",
    "tests/fixtures/journal_space_perimeter.json",
]
action = "journal"
expect = "Success"
log_contains = ["info: flight: jumped into Perimeter — 1 jump so far"]

[[case]]
name = "arrival names the station, the jumps it took and the end of the route"
fixtures = [
    "tests/fixtures/journal_space_jita.json",
    "tests/fixtures/journal_space_perimeter.json",
    "tests/fixtures/journal_docked_arrived.json",
]
action = "journal"
expect = "Success"
log_contains = [
    "info: flight: docked at Perimeter II - Moon 1 - Caldari Navy Assembly Plant after 1 jump",
    "info: mission: the route has been flown to its end",
]

[[case]]
name = "an order given three times to no effect becomes a warning"
fixtures = [
    "tests/fixtures/route_menu_open.json",
    "tests/fixtures/route_menu_open.json",
    "tests/fixtures/route_menu_open.json",
]
action = "open_route_menu_and_warp"
expect = "Success"
log_contains = [
    "info: flight: ordered Jump Through Stargate from the menu",
    "warn: flight: ordered Jump Through Stargate from the menu — 3 times over, and nothing has changed",
]
