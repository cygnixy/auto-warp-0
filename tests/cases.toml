# On 2026-08-06 at 14:32 the client kept its HudReadout and drew nothing
# inside it: no structure, no armor, no shield anywhere in the tree, while the
# capacitor stood at 100% and the stop button was drawn. Every warp of that
# flight ended in "unknown" instead of adrift, and in unknown this bot does
# nothing — it sat at the gate of its destination for eighty-two seconds
# without a word.
[[case]]
name = "a ship whose health readout went blank is still a ship in space"
fixture = "tests/fixtures/ship_hud_readout_blank.json"
action = "phase_is"
args = ["adrift"]
expect = "Success"

[[case]]
name = "and it is ordered like any free ship, not waited on"
fixture = "tests/fixtures/ship_hud_readout_blank.json"
action = "open_route_menu_and_warp"
expect = "Success"
log_contains = ["open_menu chose \"Jump Through Stargate\""]

[[case]]
name = "a client saying nothing at all is said aloud, not sat through in silence"
fixtures = [
    "tests/fixtures/phase_unknown.json",
    "tests/fixtures/phase_unknown.json",
    "tests/fixtures/phase_unknown.json",
]
action = "journal"
expect = "Success"
log_contains = ["the client is saying nothing about where the ship is"]

[[case]]
name = "a ship drifting out of a station is free: nobody ordered that motion"
fixture = "tests/fixtures/ship_drifting.json"
action = "phase_is"
args = ["adrift"]
expect = "Success"

[[case]]
name = "an order just given is given a beat before it is given again"
fixtures = [
    "tests/fixtures/route_menu_open.json",
    "tests/fixtures/ship_drifting.json",
]
action = "open_route_menu_and_warp"
expect = "Running"

# A ship coasting out of a station is the state this bot hung in for
# sixty-two seconds on 2026-08-06: the order was lost in a session change, the
# ship kept flying forward by itself, and speed was read as obedience. The
# case that stood here ran seven ticks of a ship at 240 m/s, expected Running,
# and so asserted the hang itself — under the old guard it could not have
# failed. It now ends on the tick that gives the order again, which is what
# its name always promised.
[[case]]
name = "a ship that gets nowhere under its order is ordered again in the end"
fixtures = [
    "tests/fixtures/route_menu_open.json",
    "tests/fixtures/drifting_after_undock.json",
    "tests/fixtures/drifting_after_undock.json",
    "tests/fixtures/drifting_after_undock.json",
    "tests/fixtures/drifting_after_undock.json",
    "tests/fixtures/drifting_after_undock.json",
]
tick_ms = 2000
action = "open_route_menu_and_warp"
expect = "Success"
log_contains = ["nothing has come of the last order in 8s, ordering again"]
[[case.log_counts]]
needle = "open_menu chose \"Jump Through Stargate\""
times = 2

# The other half of this law — a warp under way holds the order however long
# it lasts — is "a long warp under an order is the order working" further down.

# Waiting is allowed; waiting without a word is not. Both silent exits of this
# action cost a hang that read in the log exactly like a bot at work.
[[case]]
name = "a route panel with no marker to order from is said aloud, not waited on in silence"
fixtures = [
    "tests/fixtures/drifting_no_markers.json",
    "tests/fixtures/drifting_no_markers.json",
]
action = "open_route_menu_and_warp"
expect = "Running"
log_contains = ["the route panel shows no marker to order from"]

# Live run, 2026-08-09: a system-kind mission arrived in Urlen with the route
# actually spent -- next_system already null, not merely a marker slow to
# redraw -- and this action answered Running forever regardless, 243 lines
# and an escalating warning nobody could stop by hand. next_system is what
# tells this fixture apart from drifting_no_markers.json just above, which
# keeps a real place named and must keep waiting. This case is load-bearing
# for fly_route's own exit condition: without the Failure here, that
# condition is never even reached, whatever it says.
[[case]]
name = "a route with nowhere further named is not waited on: there is nothing left to order"
fixture = "tests/fixtures/drifting_route_flown.json"
action = "open_route_menu_and_warp"
expect = "Failure"

# The missing case a Critical review finding pointed at: arrived in a
# station's system (0 more jumps, next_system already null) with the
# station's own marker still standing and not yet docked. jumps and
# next_system going quiet do not mean the route is spent when a dock is
# still owed -- the marker is what says so, and this fixture keeps one.
# Dock is recorded by name so fly_route's own exit condition (_state ==
# "dock") knows a dock was actually asked for here, not assumed from a
# destination_kind the operator may never have set: the mission this task
# started from set no route of its own at all, another bot laid it, and a
# kind read off a text field nobody filled in is not a fact about where
# this route actually leads.
[[case]]
name = "a station's own marker still standing after the last jump is dock, and dock is recorded as what it is"
fixture = "tests/fixtures/route_menu_open_dock.json"
action = "open_route_menu_and_warp"
expect = "Success"
log_contains = [
    "info: flight: ordered Dock from the menu",
    "bb_set _state = String(\"dock\")",
]

[[case]]
name = "arriving at the gate does not end the order that is taking the ship through it"
fixtures = [
    "tests/fixtures/in_space_warping.json",
    "tests/fixtures/journal_space_jita.json",
]
action = "journal"
expect = "Success"
[[case.log_counts]]
needle = "bb_set order_pending = Integer(0)"
times = 0

[[case]]
name = "the jump itself ends it: the client has done what was asked"
fixtures = [
    "tests/fixtures/in_space_warping.json",
    "tests/fixtures/session_changing.json",
]
action = "journal"
expect = "Success"
[[case.log_counts]]
needle = "bb_set order_pending = Integer(0)"
times = 1

[[case]]
name = "a ship drifting out of a station is ordered, not waited on"
fixture = "tests/fixtures/drifting_after_undock.json"
action = "open_route_menu_and_warp"
expect = "Success"
log_contains = ["open_menu chose \"Jump Through Stargate\""]

