# survey_ship: the ship's module panel is written down while the ship is in
# warp, where the twenty seconds it costs are being spent on flying anyway.
#
# The walk itself is cygnixy/std's std.survey, and agent-missions calls the same
# one from an action of the same name. What is decided here is when: this bot is
# shared -- other missions fly with it, and a fight's business is none of theirs
# -- so the survey is off unless the mission asks for it, and it does not begin
# before the ship is actually flying.

# Off is the default, and off means nothing happens: no hover, and not a word
# in the log. Any neighbouring mission that upgrades this bot and changes
# nothing must not be able to tell the difference.
[[case]]
name    = "with the survey off, a flight in warp hovers nothing and says nothing"
action  = "survey_ship"
fixture = "tests/fixtures/ship_slots_warping.json"
args    = [false]
expect  = "Success"
log_absent = ["hover", "ship:"]

# A variable that never arrives reads as off, and that is the opposite of
# agent-missions' answer to the same nil: there the survey is the bot's own job
# and nil means "nobody said, take it"; here it is a favour to a mission that
# asked, and a mission that did not ask gets a flight, not ten hovers.
[[case]]
name    = "no variable at all leaves the flight exactly as it was"
action  = "survey_ship"
fixture = "tests/fixtures/ship_slots_warping.json"
args    = []
expect  = "Success"
log_absent = ["hover", "ship:"]

# Asked for, and the ship is in warp: the walk begins on the first slot. The
# coordinate is the same F1 the walk's own cases in cygnixy/std hover, because
# the fixture is that same live panel with one field changed.
[[case]]
name    = "with the survey on and the ship in warp, the walk begins"
action  = "survey_ship"
fixture = "tests/fixtures/ship_slots_warping.json"
args    = [true]
expect  = "Running"
log_contains = ["hover(1065, 935)"]

# Asked for, and the ship is not flying yet: NOT begun. This is the whole point
# of the move -- a survey taken standing still is the twenty seconds the
# operator asked to stop paying, and the module panel is drawn and readable long
# before the warp starts, so "there are slots on screen" is not the question.
# The phase is, and it is the same phase this bot's tree steers by.
[[case]]
name    = "with the survey on and the ship still adrift, nothing is hovered yet"
action  = "survey_ship"
fixture = "tests/fixtures/ship_slots_adrift.json"
args    = [true]
expect  = "Success"
log_contains = [
    "info: ship: the ship is not in warp (adrift): the survey waits until it is",
]
log_absent = ["hover"]

# The same for a phase that is not a phase of flight at all: undocking. Two
# cases rather than one because the line names the phase it read, and a check
# that only ever sees "adrift" would pass just as well against a check written
# as "not adrift".
[[case]]
name    = "a ship still leaving the station is not a ship in warp"
action  = "survey_ship"
fixture = "tests/fixtures/phase_undocking.json"
args    = [true]
expect  = "Success"
log_contains = [
    "info: ship: the ship is not in warp (undocking): the survey waits until it is",
]
log_absent = ["hover"]

# --- select_travel_tab -------------------------------------------------------
#
# THE SCREEN THE SHIP TRAVELS UNDER, and the reason it is this bot's business is
# the run of 2026-08-13 10:22. The fight step of the same mission put the overview
# on the tab it FIGHTS by before warping to the mission's place; the ship was at a
# gate in Niyabainen, that tab holds the empire's own customs officers and sentry
# guns there, and the fight — which takes any row of its own tab for an enemy —
# ordered a lock on a Caldari Customs Commissioner. The fight step waits for the
# pocket now, and this bot holds the flying tab for the whole flight, because a
# tab nobody holds is a tab anybody may have left anywhere.
#
# The whole mechanism is std.tabs, tested in the library's own cases against its
# own budgets. What is this bot's own, and what these cases are about, is: WHEN it
# runs (not in a hangar), and that it NEVER holds the tick — a flight delayed for
# a filter would be paying for the wrong thing.
#
# The fixtures are hand-made, one state of a strip each, in the manner of the
# library's: three tabs, a ship adrift in space. The shape of a real strip is held
# by `bot-harness lint` against the reference dumps and by mission-combat's
# fixtures, which are whole frames of that run.

[[case]]
name    = "an overview on another tab is put on the flight's own, with one press"
action  = "select_travel_tab"
fixture = "tests/fixtures/travel_tab_elsewhere.json"
args    = [1]
expect  = "Success"
log_contains = [
    "info: flight: the overview is on another tab — pressing tab 1, the flight's own",
    "click_path(\"overview_windows.tabs[0].tab_region\", \"left\")",
]
[[case.log_counts]]
needle = "click_path("
times  = 1

# THE FLIGHT IS NEVER HELD UP FOR A TAB. The case above already says it — Success
# on the very tick the press goes out — and it is worth saying why in a case of
# its own: in mission-combat this same press answers Running, because lock_target
# stands behind it and presses an overview row by the region read in that tick.
# Nothing here reads a row, so nothing here may cost the flight a tick.
[[case]]
name    = "a tab press does not cost the flight its tick"
action  = "select_travel_tab"
fixture = "tests/fixtures/travel_tab_elsewhere.json"
args    = [1]
expect  = "Success"
log_absent = ["Running"]

# The travel tab is already up: NO GESTURE OF ANY KIND. Not a press to be sure,
# not a press because the last tick pressed.
[[case]]
name    = "an overview already on the flight's tab is not pressed at all"
action  = "select_travel_tab"
fixture = "tests/fixtures/travel_tab_up.json"
args    = [1]
expect  = "Success"
[[case.log_counts]]
needle = "click_path("
times  = 0
[[case.log_counts]]
needle = "click("
times  = 0

# THE SWITCH IS CONFIRMED BY READING, NOT BY PRESSING. Two ticks: the first finds
# another tab up and presses, the second reads the client's own pointer under the
# flight's tab and says so. One press for the two.
[[case]]
name     = "the switch is said done when the pointer has moved, not when the press went out"
action   = "select_travel_tab"
fixtures = [
    "tests/fixtures/travel_tab_elsewhere.json",
    "tests/fixtures/travel_tab_up.json",
]
tick_ms  = 6000
args     = [1]
expect   = "Success"
log_contains = ["info: flight: the overview is on tab 1, the flight's own"]
[[case.log_counts]]
needle = "click_path("
times  = 1

# NO NUMBER, NO SWITCH, AND ONE LINE ABOUT IT. There is no travel tab to invent,
# and a mission that hands nothing down flies on whatever tab is up — knowingly,
# because the line is loud and it is said exactly once rather than once a tick.
[[case]]
name     = "with no travel_tab given, nothing is switched and the silence is said once"
action   = "select_travel_tab"
fixtures = [
    "tests/fixtures/travel_tab_elsewhere.json",
    "tests/fixtures/travel_tab_elsewhere.json",
    "tests/fixtures/travel_tab_elsewhere.json",
]
args     = [0]
expect   = "Success"
[[case.log_counts]]
needle = "warn: flight: no travel_tab was given to this step"
times  = 1
[[case.log_counts]]
needle = "click_path("
times  = 0

# A HANGAR HAS NO OVERVIEW TO HOLD. Nothing is pressed and — the point of the
# guard — nothing is WAITED for either: without it a docked run would spend the
# strip's whole minute and then warn about a strip nobody is drawing, every third
# tick, for as long as the ship sat there.
[[case]]
name    = "a docked client is not flying: no press, and no wait for a strip"
action  = "select_travel_tab"
fixture = "tests/fixtures/docked_with_route.json"
args    = [1]
expect  = "Success"
log_absent = ["tab strip is not drawn yet", "click_path("]

# In space with the strip not drawn — a session change, the client between things
# — the wait is std.tabs' own: bounded, said, and nothing pressed on a guess.
# "Not drawn yet" is never "this client has no tabs".
[[case]]
name    = "an overview with no tab strip yet is waited for, not pressed around"
action  = "select_travel_tab"
fixture = "tests/fixtures/travel_tab_undrawn.json"
args    = [1]
expect  = "Success"
log_contains = ["info: flight: the overview's tab strip is not drawn yet"]
[[case.log_counts]]
needle = "click_path("
times  = 0

# --- report_ship_health ------------------------------------------------------
#
# WHETHER THE SHIP'S OWN HEALTH CAN BE READ, said here so that it is heard in
# time. The reading and the words are std.health's — two bots ask this now, and a
# second copy of either would drift from the first on the first repair. What this
# action decides is the consequence, and the consequence of a flight is "carry on".
#
# The operator's requirement of 2026-08-13 is about WHEN. The health is the only
# sign a fight has for when to leave; the run of that day's 11:35 had it missing
# from the first tick, and the first anybody heard was the fight step saying so
# from inside the mission's pocket — four jumps past the last moment anybody could
# have fixed it. It is a setting (ShipUI options -> Display Readout as Percentage),
# fixed at the keyboard in five seconds.

# The ordinary flight: the health reads, and nothing at all is said about it.
[[case]]
name    = "a flight whose ship reads its own health says nothing about it"
action  = "report_ship_health"
fixture = "tests/fixtures/drifting_after_undock.json"
expect  = "Success"
log_absent = ["Display Readout as Percentage", "has not been drawn yet"]

# The fault, on a frame of a ship in space with no health on it: the setting is
# named, and the flight carries on. THE FLIGHT IS NOT FAILED — this bot never
# shoots and could not act on the number if it had it, so stranding a ship
# mid-route over a setting only a human can change would punish the mission for
# its own warning.
[[case]]
name    = "a ship in space with no health names the setting, and the flight carries on"
action  = "report_ship_health"
fixture = "tests/fixtures/in_space_warping.json"
expect  = "Success"
log_contains = [
    "warn: flight: the ship's health does not read: neither the shield nor the armour came back, though the client is drawing the ship.",
    "Display Readout as Percentage",
    "the fight at the end of this route will not start without it",
]
[[case.log_counts]]
needle = "click("
times  = 0

# ONCE, NOT ONCE A TICK. A setting nothing but the operator will change, repeated
# every tick of a four-jump flight, is the log of 11:35 all over again — and that
# log is why this task exists. Four ticks, one line.
[[case]]
name     = "the setting is named once, however long the flight lasts"
action   = "report_ship_health"
fixtures = [
    "tests/fixtures/in_space_warping.json",
    "tests/fixtures/in_space_warping.json",
    "tests/fixtures/in_space_warping.json",
    "tests/fixtures/in_space_warping.json",
]
expect   = "Success"
[[case.log_counts]]
needle = "warn: flight: the ship's health does not read"
times  = 1

# And held only while it lasts: a health that comes back and goes again is news
# again. Without the mark being spent on the good tick this would say it once and
# then be silent for the rest of the run.
[[case]]
name     = "a health that comes back and goes again is said again"
action   = "report_ship_health"
fixtures = [
    "tests/fixtures/in_space_warping.json",
    "tests/fixtures/drifting_after_undock.json",
    "tests/fixtures/in_space_warping.json",
]
expect   = "Success"
[[case.log_counts]]
needle = "warn: flight: the ship's health does not read"
times  = 2

# THE THIRD ANSWER, AND IT MUST NOT SOUND LIKE THE SECOND. A hangar has no ship
# panel to read a health from, and blaming the operator's settings for that would
# be this project's own besetting fault — an absence taken for a fact — committed
# inside the code written to cure it. It accuses nobody and it mends itself.
[[case]]
name    = "a docked ship is not accused of a setting"
action  = "report_ship_health"
fixture = "tests/fixtures/docked_with_route.json"
expect  = "Success"
log_contains = ["debug: flight: the ship's health has not been drawn yet"]
log_absent = ["Display Readout as Percentage"]

# The other way of having no panel, and the one this bot meets on every jump of
# every route: the client between systems.
[[case]]
name    = "a client in a session change is not accused of a setting either"
action  = "report_ship_health"
fixture = "tests/fixtures/session_changing.json"
expect  = "Success"
log_contains = ["debug: flight: the ship's health has not been drawn yet"]
log_absent = ["Display Readout as Percentage"]

# AND A SESSION CHANGE IS NEVER WARNED ABOUT, HOWEVER LONG IT LASTS. Found in the
# live flight of 2026-08-13 12:39, in this action's own first version: the third
# answer went through log.repeated at debug, and log.repeated ESCALATES — at the
# third, ninth and twenty-seventh repeat it emits at WARN whatever level it was
# given, with "still trying" on the end. Three session changes of one flight left
# four warnings saying that a hangar is not a setting anybody has to change.
#
# std.log's own comment says it: "where repetition is normal, use M.debug — a
# warning for expected behaviour teaches the reader to ignore warnings". A session
# change on every jump is as normal as repetition gets. Six ticks, one line, and no
# "still trying" anywhere.
[[case]]
name     = "a session change is one debug line, never a warning that grows"
action   = "report_ship_health"
fixtures = [
    "tests/fixtures/session_changing.json",
    "tests/fixtures/session_changing.json",
    "tests/fixtures/session_changing.json",
    "tests/fixtures/session_changing.json",
    "tests/fixtures/session_changing.json",
    "tests/fixtures/session_changing.json",
]
expect   = "Success"
log_absent = ["still trying", "warn: flight:"]
[[case.log_counts]]
needle = "debug: flight: the ship's health has not been drawn yet"
times  = 1

# And the stretch ends when the panel comes back, so the NEXT session change is a
# line again — the same rule the setting's own line keeps. A jump, in four ticks:
# in space, in session, in space, in session.
[[case]]
name     = "a panel that comes back and goes again is a line again"
action   = "report_ship_health"
fixtures = [
    "tests/fixtures/drifting_after_undock.json",
    "tests/fixtures/session_changing.json",
    "tests/fixtures/drifting_after_undock.json",
    "tests/fixtures/session_changing.json",
]
expect   = "Success"
log_absent = ["still trying"]
[[case.log_counts]]
needle = "debug: flight: the ship's health has not been drawn yet"
times  = 2

# The two answers are held under ONE mark, and they must never mask each other: a
# flight that lost the panel and then found it with the setting off has to hear
# about the setting. Three ticks: in session, then in space with no health, and the
# warning has to arrive.
[[case]]
name     = "a session change does not swallow the setting that follows it"
action   = "report_ship_health"
fixtures = [
    "tests/fixtures/session_changing.json",
    "tests/fixtures/in_space_warping.json",
]
expect   = "Success"
log_contains = [
    "debug: flight: the ship's health has not been drawn yet",
    "warn: flight: the ship's health does not read",
]
log_absent = ["still trying"]

# --- a flight that is going well leaves no warnings ---------------------------
#
# The same rule as mission-combat's own section, and the same measurement behind
# it: std.log.repeated escalates to WARN on the third, ninth and twenty-seventh
# repeat whatever level it is handed, so a state that repeats because it is
# supposed to becomes a warning about nothing. Which function a line uses is
# decided by whether the bot has an UNPASSED FRONTIER — a gesture of its own that
# has not been answered, or a budget whose running out changes what it does — and
# never by how often the line repeats.
#
# What is NOT quieted here, and deliberately: every "waiting for the foreground"
# line. The operator working in another window is a real impediment that only the
# operator can clear, the bot really is retrying a gesture into it, and the count
# is how the operator sees how long they have been away.

# The survey waits for warp, and a flight spends whole minutes not in warp. There
# is nothing to try harder at: the ship is going to warp or it is not.
[[case]]
name     = "a ship not yet in warp is not a bot that is stuck"
action   = "survey_ship"
fixtures = [
    "tests/fixtures/drifting_after_undock.json",
    "tests/fixtures/drifting_after_undock.json",
    "tests/fixtures/drifting_after_undock.json",
    "tests/fixtures/drifting_after_undock.json",
    "tests/fixtures/drifting_after_undock.json",
    "tests/fixtures/drifting_after_undock.json",
]
args     = [true]
expect   = "Success"
log_contains = ["info: ship: the ship is not in warp (adrift): the survey waits until it is"]
log_absent = ["still trying"]
[[case.log_counts]]
needle = "info: ship: the ship is not in warp (adrift): the survey waits until it is"
times  = 1

# --- something to fly ------------------------------------------------------
#
# The silent hole: no destination, no route, set_route fails, and
# @repeat_until_success runs the whole thing again for as long as anybody
# leaves it. It reaches a mission most easily through a route with no jumps in
# it — cygnixy/agent-missions lays the route home with the mission's own
# button, and a mission taken in the agent's own system has no jumps to lay.

[[case]]
name    = "a flight with a destination has somewhere to go, route or no route"
action  = "somewhere_to_fly"
fixture = "tests/fixtures/drifting_route_flown.json"
args    = ["Jita", ""]
expect  = "Success"
log_absent = ["error:", "warn:", "no destination and no route yet"]

[[case]]
name    = "a flight with no destination follows the route it was left"
action  = "somewhere_to_fly"
fixture = "tests/fixtures/route_collapsed.json"
args    = ["", ""]
expect  = "Success"
log_absent = ["error:", "warn:", "no destination and no route yet"]

# A collapsed panel counts jumps and draws no markers; an expanded one has been
# seen carrying markers with no count. Either one is a route, and this is the
# second of the two shapes.
[[case]]
name    = "markers with no jump count are a route too"
action  = "somewhere_to_fly"
fixture = "tests/fixtures/route_already_set.json"
args    = ["", ""]
expect  = "Success"
log_absent = ["error:", "warn:", "no destination and no route yet"]

# Nothing to fly, and the tick is not spent on saying so: the flight below is
# tried exactly as it would have been. The line is said once, not counted up.
[[case]]
name    = "nothing to fly is said once and costs the tick nothing"
action  = "somewhere_to_fly"
fixture = "tests/fixtures/drifting_route_flown.json"
args    = ["", ""]
expect  = "Success"
log_contains = ["info: flight: no destination and no route yet"]
log_absent = ["error:"]

# The point of the whole action: the silence gets a bound and a sentence.
[[case]]
name     = "a flight that never acquires anything to fly ends with a reason"
action   = "somewhere_to_fly"
fixtures = [
    "tests/fixtures/drifting_route_flown.json",
    "tests/fixtures/drifting_route_flown.json",
]
tick_ms  = 70000
args     = ["", ""]
expect   = "Failure"
log_contains = ["error: flight: this flight was given no destination and there is no route to follow, 60000ms on"]

# The return leg has its own destination, and it is the one that counts once the
# mission has turned around: leg.pick, the same gate every set_route action
# passes its two names through.
[[case]]
name    = "on the way home it is the return destination that counts"
action  = "somewhere_to_fly"
fixture = "tests/fixtures/drifting_route_flown.json"
args    = ["", "Jita IV - Moon 4"]
setup_bb = { _leg = "home" }
expect  = "Success"
log_absent = ["error:", "warn:", "no destination and no route yet"]
