[[case]]
name = "the route block icon is pressed once: it is a toggle like the rest"
fixtures = [
    "tests/fixtures/route_block_hidden.json",
    "tests/fixtures/route_block_hidden.json",
    "tests/fixtures/route_block_hidden.json",
]
action = "set_route_show_route"
expect = "Running"
tick_ms = 400
[[case.log_counts]]
needle = "click_path(\"info_panel_container.icons.route\""
times = 1

[[case]]
name = "a category header is pressed once: pressing it again would collapse it"
fixtures = [
    "tests/fixtures/search_groups_collapsed.json",
    "tests/fixtures/search_groups_collapsed.json",
    "tests/fixtures/search_groups_collapsed.json",
]
action = "set_route_expand_category"
args = ["station"]
expect = "Running"
tick_ms = 400
[[case.log_counts]]
needle = "click(952, 504"
times = 1

# --- modals: acknowledge, never consent ---------------------------------------

[[case]]
name = "an information box is acknowledged with OK, unasked"
fixture = "tests/fixtures/message_box_ok.json"
action = "dismiss_message_box"
expect = "Running"
log_contains = ["click(960, 636", "info: client: dismissed a message box with \"OK\""]

[[case]]
name = "a box that only offers consent is left to the operator's own flag"
fixture = "tests/fixtures/message_box_consent.json"
action = "dismiss_message_box"
expect = "Success"
[[case.log_counts]]
needle = "click("
times = 0

[[case]]
name = "no box, nothing to do"
fixture = "tests/fixtures/search_open_empty.json"
action = "dismiss_message_box"
expect = "Success"

[[case]]
name = "a field with text in it is cleared before anything else happens"
fixture = "tests/fixtures/search_open_stale_text.json"
action = "set_route_clear_field"
expect = "Running"
log_contains = ["click(341, 85"]

[[case]]
name = "a field whose text will not read is treated as empty, not as a reason to stall"
fixture = "tests/fixtures/search_text_unreadable.json"
action = "set_route_clear_field"
expect = "Success"
[[case.log_counts]]
needle = "click("
times = 0

[[case]]
name = "an empty field with a cross in it is empty: this client always draws the cross"
fixture = "tests/fixtures/search_empty_with_cross.json"
action = "set_route_clear_field"
expect = "Success"
[[case.log_counts]]
needle = "click("
times = 0

[[case]]
name = "and it is typed into, rather than cleared for ever"
fixture = "tests/fixtures/search_empty_with_cross.json"
action = "set_route_type_destination"
args = ["Jita"]
expect = "Running"
log_contains = ["type_text(\"Jita\")"]

# --- a collapsed route panel draws no markers, but its header still counts ----

[[case]]
name = "a route is set even when the panel that would show it is shut"
fixture = "tests/fixtures/route_collapsed.json"
action = "is_route_set"
expect = "Success"

[[case]]
name = "and the choice is done: the client has laid the route asked for"
fixture = "tests/fixtures/route_collapsed.json"
action = "set_route_choose"
args = ["Jita"]
expect = "Success"

[[case]]
name = "a shut panel is opened, because the flight steers by the markers in it"
fixture = "tests/fixtures/route_collapsed.json"
action = "set_route_show_route"
expect = "Running"
log_contains = ["click(56, 200"]

[[case]]
name = "an open panel with markers is left alone"
fixture = "tests/fixtures/route_expanded.json"
action = "set_route_show_route"
expect = "Success"
[[case.log_counts]]
needle = "click("
times = 0
