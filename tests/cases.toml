action = "set_route_close_search"
expect = "Success"

# --- the log: what the mission says about itself ------------------------------

[[case]]
name = "the mission says where it is bound and what the route shows"
fixture = "tests/fixtures/journal_docked_jita.json"
action = "journal"
args = ["Jita IV - Moon 4 - Caldari Navy Assembly Plant", "station"]
expect = "Success"
log_contains = [
    "info: mission: auto-warp-0 0.0.0-harness on cygnixy 0.0.0-harness",
    "info: mission: bound for Jita IV - Moon 4 - Caldari Navy Assembly Plant, looked up among the stations",
    "info: route: the client is showing the route; next waypoint Perimeter",
]

[[case]]
name = "with no destination the mission says it is flying the route it was given"
fixture = "tests/fixtures/journal_docked_jita.json"
action = "journal"
expect = "Success"
log_contains = ["info: mission: no destination given"]

[[case]]
name = "leaving the station is recorded, whoever pressed the button"
fixtures = [
    "tests/fixtures/journal_docked_jita.json",
    "tests/fixtures/journal_space_jita.json",
]
action = "journal"
expect = "Success"
log_contains = ["info: flight: undocked into Jita"]

[[case]]
name = "a jump is counted when the system under the ship changes"
fixtures = [
    "tests/fixtures/journal_space_jita.json",
    "tests/fixtures/journal_space_perimeter.json",
]
action = "journal"
expect = "Success"
log_contains = ["info: flight: jumped into Perimeter — 1 jump so far"]

[[case]]
name = "arrival names the station, the jumps it took and the end of the route"
fixtures = [
    "tests/fixtures/journal_space_jita.json",
    "tests/fixtures/journal_space_perimeter.json",
    "tests/fixtures/journal_docked_arrived.json",
]
action = "journal"
expect = "Success"
log_contains = [
    "info: flight: docked at Perimeter II - Moon 1 - Caldari Navy Assembly Plant after 1 jump",
    "info: mission: the route to Hykkota V - Moon 17 has been flown to its end",
]
args = ["Hykkota V - Moon 17", "station"]

[[case]]
name = "an order that stands is not given again three ticks running"
fixtures = [
    "tests/fixtures/route_menu_open.json",
    "tests/fixtures/route_menu_open.json",
    "tests/fixtures/route_menu_open.json",
]
action = "open_route_menu_and_warp"
expect = "Running"
log_contains = ["info: flight: ordered Jump Through Stargate from the menu"]
tick_ms = 400
[[case.log_counts]]
needle = "open_menu chose \"Jump Through Stargate\""
times = 1

# --- the foreground: the operator's window is not a broken client -------------

[[case]]
name = "a refused foreground waits for another tick instead of ending the mission"
fixture = "tests/fixtures/search_open_empty.json"
action = "set_route_type_destination"
args = ["Jita"]
foreground = false
expect = "Running"
log_contains = ["debug: route: waiting for the foreground before focusing the search field"]

[[case]]
name = "the search is not opened while the operator holds the foreground"
fixture = "tests/fixtures/search_closed.json"
action = "set_route_open_search"
foreground = false
expect = "Running"

[[case]]
name = "a foreground held for three ticks running is worth a warning"
fixtures = [
    "tests/fixtures/search_open_empty.json",
    "tests/fixtures/search_open_empty.json",
    "tests/fixtures/search_open_empty.json",
]
action = "set_route_type_destination"
args = ["Jita"]
foreground = false
expect = "Running"
log_contains = ["warn: route: waiting for the foreground before focusing the search field — 3 times now"]

[[case]]
name = "any change of phase clears the count of orders given"
fixtures = [
    "tests/fixtures/journal_space_jita.json",
    "tests/fixtures/in_space_warping.json",
]
action = "journal"
expect = "Success"
log_contains = [
    "debug: phase: adrift -> warping",
    "bb_set log_chose = String(\"\")",
    "bb_set log_route_menu = String(\"\")",
]

[[case]]
name = "a jump is still counted when the client changes the system under the ship"
fixtures = [
    "tests/fixtures/journal_space_jita.json",
    "tests/fixtures/journal_space_perimeter.json",
]
action = "journal"
expect = "Success"
log_contains = ["info: flight: jumped into Perimeter"]

# --- reacting instead of timing ----------------------------------------------

[[case]]
name = "an unanswered order is given again, not timed out"
fixtures = [
    "tests/fixtures/search_row_menu_open.json",
    "tests/fixtures/search_row_menu_open.json",
    "tests/fixtures/search_row_menu_open.json",
]
action = "set_route_choose"
args = ["Jita"]
expect = "Running"
log_contains = [
    "warn: route: destination set to \"Jita\" — 3 times now, still trying",
]

[[case]]
name = "a window still on screen is pressed again, however long it has been there"
fixtures = [
    "tests/fixtures/search_groups_collapsed.json",
    "tests/fixtures/search_groups_collapsed.json",
    "tests/fixtures/search_groups_collapsed.json",
    "tests/fixtures/search_groups_collapsed.json",
]
action = "set_route_close_search"
expect = "Running"
log_contains = ["click(960, 706"]

# --- the phase: one answer to "what is going on" ------------------------------

[[case]]
name = "a hangar is a hangar even though the ship panel is drawn there too"
fixture = "tests/fixtures/search_station_row_live.json"
action = "phase_is"
args = ["docked"]
expect = "Success"

[[case]]
name = "in space with nothing happening is the phase that may be given orders"
fixture = "tests/fixtures/journal_space_jita.json"
action = "phase_is"
args = ["adrift"]
expect = "Success"

[[case]]
name = "a warping ship is not adrift"
fixture = "tests/fixtures/in_space_warping.json"
action = "phase_is"
args = ["adrift"]
expect = "Failure"

[[case]]
name = "the client announcing an undocking is not a client with nothing to say"
fixture = "tests/fixtures/phase_undocking.json"
action = "phase_is"
args = ["undocking"]
expect = "Success"

[[case]]
name = "docking is read from the announcement, before the hangar appears"
fixture = "tests/fixtures/phase_docking.json"
action = "phase_is"
args = ["docking"]
expect = "Success"

[[case]]
name = "a session change is its own phase, not an absence of others"
fixture = "tests/fixtures/session_changing.json"
action = "phase_is"
args = ["session"]
expect = "Success"

[[case]]
name = "a client saying nothing is unknown, and unknown is not free to act"
fixture = "tests/fixtures/phase_unknown.json"
action = "phase_is"
args = ["adrift", "docked"]
expect = "Failure"

[[case]]
name = "the unknown is named, so the tree can wait in it deliberately"
fixture = "tests/fixtures/phase_unknown.json"
action = "phase_is"
args = ["unknown"]
expect = "Success"

[[case]]
name = "silence between systems is not an undocking"
fixtures = [
    "tests/fixtures/journal_docked_jita.json",
    "tests/fixtures/phase_unknown.json",
    "tests/fixtures/journal_docked_jita.json",
]
action = "journal"
expect = "Success"
log_contains = ["debug: phase: docked -> unknown"]

[[case]]
name = "a ship drifting out of a station is free: nobody ordered that motion"
fixture = "tests/fixtures/ship_drifting.json"
action = "phase_is"
args = ["adrift"]
expect = "Success"

[[case]]
name = "an order given is not given again while the ship is seen obeying it"
fixtures = [
    "tests/fixtures/route_menu_open.json",
    "tests/fixtures/ship_drifting.json",
]
action = "open_route_menu_and_warp"
expect = "Running"

[[case]]
name = "a ship that gets nowhere under its order is ordered again in the end"
fixtures = [
    "tests/fixtures/route_menu_open.json",
    "tests/fixtures/ship_drifting.json",
    "tests/fixtures/ship_drifting.json",
    "tests/fixtures/ship_drifting.json",
    "tests/fixtures/ship_drifting.json",
    "tests/fixtures/ship_drifting.json",
    "tests/fixtures/ship_drifting.json",
]
action = "open_route_menu_and_warp"
expect = "Running"

[[case]]
name = "arriving at the gate does not end the order that is taking the ship through it"
fixtures = [
    "tests/fixtures/in_space_warping.json",
    "tests/fixtures/journal_space_jita.json",
]
action = "journal"
expect = "Success"
[[case.log_counts]]
needle = "bb_set order_pending = Integer(0)"
times = 0

[[case]]
name = "the jump itself ends it: the client has done what was asked"
fixtures = [
    "tests/fixtures/in_space_warping.json",
    "tests/fixtures/session_changing.json",
]
action = "journal"
expect = "Success"
[[case.log_counts]]
needle = "bb_set order_pending = Integer(0)"
times = 1

[[case]]
name = "a ship drifting out of a station is ordered, not waited on"
fixture = "tests/fixtures/drifting_after_undock.json"
action = "open_route_menu_and_warp"
expect = "Success"
log_contains = ["open_menu chose \"Jump Through Stargate\""]

# --- a press is not an order --------------------------------------------------

[[case]]
name = "the magnifier is pressed once to open the search, and not once per tick"
fixtures = [
    "tests/fixtures/search_closed.json",
    "tests/fixtures/search_closed.json",
    "tests/fixtures/search_closed.json",
]
action = "set_route_open_search"
expect = "Running"
# Такт покороче настоящего: три такта укладываются в полторы секунды
# выдержки, и проверяется именно «нажал и ждёт», а не «дождался и нажал
# снова».
tick_ms = 400
[[case.log_counts]]
needle = "click_path(\"info_panel_container.icons.search\""
times = 1

[[case]]
name = "the undock button is pressed once, not once per tick"
fixtures = [
    "tests/fixtures/docked_with_route.json",
    "tests/fixtures/docked_with_route.json",
    "tests/fixtures/docked_with_route.json",
]
action = "push_undock_button"
expect = "Running"
# Такт покороче настоящего: три такта укладываются в полторы секунды
# выдержки, и проверяется именно «нажал и ждёт», а не «дождался и нажал
# снова».
tick_ms = 400
[[case.log_counts]]
needle = "click_path(\"station_window.buttons.Undock\""
times = 1

[[case]]
name = "a wait that lasts is reported less and less often, not thirty times over"
fixtures = [
    "tests/fixtures/search_open_empty.json",
    "tests/fixtures/search_open_empty.json",
    "tests/fixtures/search_open_empty.json",
    "tests/fixtures/search_open_empty.json",
    "tests/fixtures/search_open_empty.json",
    "tests/fixtures/search_open_empty.json",
    "tests/fixtures/search_open_empty.json",
    "tests/fixtures/search_open_empty.json",
    "tests/fixtures/search_open_empty.json",
]
action = "set_route_type_destination"
args = ["Jita"]
foreground = false
expect = "Running"
log_contains = [
    "warn: route: waiting for the foreground before focusing the search field — 3 times now",
    "warn: route: waiting for the foreground before focusing the search field — 9 times now",
]
[[case.log_counts]]
needle = "warn: route: waiting for the foreground before focusing the search field"
times = 2

[[case]]
name = "a route panel blanked by a session change is not an answer about the route"
